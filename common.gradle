version = "${mod_version}+${minecraft_version}"
group = 'dev.no.name'
base.archivesName = 'afriends'

sourceSets.main {
	java.srcDirs += rootProject.file('src/main/java')
	resources.srcDirs += rootProject.file('src/main/resources')
	resources.srcDirs += rootProject.file("src/shaders/${shader_family}")
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	if (project.obfuscated) {
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
	} else {
		implementation "net.fabricmc:fabric-loader:${loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
	}
	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets.test.java.srcDirs += rootProject.file('src/test/java')

test {
	useJUnitPlatform()
}

processResources {
	def props = [version: project.version, minecraft_dependency: project.minecraft_dependency, java_version: project.java_version]
	inputs.properties props
	filesMatching('fabric.mod.json') {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = project.java_version as int
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.toVersion(project.java_version)
	targetCompatibility = JavaVersion.toVersion(project.java_version)
}

def devUsername = providers.gradleProperty('dev_username').orNull
if (devUsername) {
	loom {
		runs {
			client {
				programArgs '--username', devUsername
			}
		}
	}
}

// Проверка сети вдвоём на одной машине:
//   ./gradlew :26.3:runClient2 — второй клиент в run2/ со своим ником (dev_username2, по умолчанию LinkTester)
//   -Plink_url=ws://127.0.0.1:18788/v1/tunnel -Plink_key=<ключ> — оба клиента на локальный сервер сети
//   -Pdev_home=<папка> / -Pdev_home2=<папка> — своя «домашняя» папка: ключи сети у каждого клиента свои,
//   а не общие на компьютер (см. SharedLinkFolder)
loom {
	runs {
		client2 {
			client()
			configName = "Minecraft Client 2"
			runDir "run2"
			programArgs '--username', providers.gradleProperty('dev_username2').getOrElse('LinkTester')
		}
	}
}
def linkUrl = providers.gradleProperty('link_url').orNull
def linkKey = providers.gradleProperty('link_key').orNull
loom.runs.configureEach {
	if (linkUrl) {
		vmArg "-Dafriends.link.url=${linkUrl}"
	}
	if (linkKey) {
		vmArg "-Dafriends.link.key=${linkKey}"
	}
}
def devHome = providers.gradleProperty('dev_home').orNull
def devHome2 = providers.gradleProperty('dev_home2').orNull
if (devHome) {
	loom.runs.named('client') { vmArg "-Duser.home=${devHome}" }
}
if (devHome2) {
	loom.runs.named('client2') { vmArg "-Duser.home=${devHome2}" }
}

tasks.register('dist', Copy) {
	from remapJarOrJar()
	into rootProject.file('dist')
}

def remapJarOrJar() {
	return tasks.findByName('remapJar') ?: tasks.named('jar')
}

// AFriends как зависимость для аддонов: ./gradlew publishToMavenLocal → dev.no.name:afriends:<версия>+<minecraft>
apply plugin: 'maven-publish'
java {
	withSourcesJar()
}
publishing {
	publications {
		mavenJava(MavenPublication) {
			artifactId = 'afriends'
			from components.java
		}
	}
}
